# Morgenzeitung – Konfiguration
# Diese Vorlage gehört zum Programm und wird bei "git pull" aktualisiert.
# Deine eigene Kopie liegt außerhalb des Repos und bleibt dabei unangetastet:
#   mkdir -p ~/.config/morgenzeitung
#   cp config.example.toml ~/.config/morgenzeitung/config.toml

[zeitung]
titel = "Morgenzeitung"
untertitel = "Deutschland · NRW · Welt"
lesezeit_minuten = 20        # Ziel: so lange soll die Lektüre dauern
woerter_pro_minute = 230     # durchschnittliches Lesetempo am E-Reader
max_alter_stunden = 20       # ältere Feed-Einträge werden ignoriert
ausgabe_ordner = "~/.local/share/morgenzeitung/ausgaben"
aufbewahren_tage = 7         # ältere Ausgaben werden gelöscht

# ---------------------------------------------------------------------------
# Quellen. Reihenfolge = Reihenfolge in der Zeitung und Priorität beim Auswählen.
#   artikel       = höchstens so viele Artikel aus dieser Quelle
#   modus         = "volltext" (ganzer Artikel) oder "schlagzeilen" (nur Titel + Anriss)
#   min_woerter   = kürzere Texte fliegen raus (z. B. Paywall-Teaser bei Le Monde)
#   ausschliessen = Wörter im Titel oder in der URL, die übersprungen werden
#   sprache       = "de" oder "fr" (Silbentrennung am Reader)
#   ersatz_fuer   = "sz": Quelle springt nur ein, wenn die SZ-Ausgabe fehlt
#   nur_mit       = nur Einträge, deren Titel oder Anriss eines dieser Wörter enthält
# ---------------------------------------------------------------------------

[[quelle]]
name = "Tagesschau"
feed = "https://www.tagesschau.de/index~rss2.xml"
ersatz_fuer = "sz"            # nur dabei, wenn heute keine SZ-Ausgabe vorliegt
artikel = 6
min_woerter = 120
ausschliessen = ["liveblog", "/video/", "/multimedia/"]

[[quelle]]
name = "WDR – Bonn & Landespolitik"
feed = "https://www1.wdr.de/uebersicht-100.feed"
artikel = 5
min_woerter = 120
nur_mit = ["Bonn", "Rhein-Sieg", "Siegburg", "Troisdorf", "Königswinter", "Bad Godesberg",
           "Beuel", "Landtag", "Landesregier", "NRW-Regierung",
           "Ministerpräsident", "Wüst", "Landesminister", "schwarz-grün"]

[[quelle]]
name = "franceinfo"
feed = "https://www.francetvinfo.fr/politique.rss"
sprache = "fr"                # für richtige Silbentrennung am Reader
artikel = 2
min_woerter = 250
ausschliessen = ["/replay-radio/", "/video/", "direct"]

[[quelle]]
name = "Le Monde"
feed = "https://www.lemonde.fr/rss/une.xml"
sprache = "fr"
artikel = 6
modus = "schlagzeilen"       # Volltext sperrt Le Monde für Nicht-Abonnenten (HTTP 402)
ausschliessen = ["/live/", "/video/"]

[[quelle]]
name = "heise online"
feed = "https://www.heise.de/rss/heise-top-atom.xml"
artikel = 8
modus = "schlagzeilen"
ausschliessen = ["heise+"]

# ---------------------------------------------------------------------------
# Fertige Ausgaben als EPUB: SZ (täglich, Hauptquelle) und ZEIT (wöchentlich, Longreads)
#
# Auswahlregeln, für beide gleich:
#   immer                  = Ressorts/Titel, die jeden Tag rein sollen (unabhängig von der Länge)
#   ressorts_bevorzugt     = Schwerpunkte, füllen die meisten Plätze
#   davon_andere           = so viele Plätze für Entdeckungen aus übrigen Ressorts
#   ressorts_ausschliessen = Ressorts, die nie vorkommen (z. B. Lokalteile)
#   ausschliessen          = Wörter im Titel/Ressort, die nie vorkommen
# Welche Ressort-Namen eine Ausgabe wirklich verwendet, zeigt der Testbefehl in der README.
# ---------------------------------------------------------------------------
[sz]
aktiv = true
ordner = "~/.local/share/morgenzeitung/sz"     # hier landet die tägliche EPUB-Ausgabe
pro_tag = 5
davon_andere = 1
min_woerter = 250
max_woerter = 2000
zaehlt_zur_lesezeit = true
immer = ["Seite Drei", "Seite 3"]
ressorts_bevorzugt = ["Politik", "Wirtschaft"]
ressorts_ausschliessen = ["München", "Bayern", "Region", "Landkreis", "Dachau", "Ebersberg",
                          "Erding", "Freising", "Fürstenfeldbruck", "Starnberg",
                          "Wolfratshausen", "Bad Tölz"]

[zeit]
aktiv = true
ordner = "~/.local/share/morgenzeitung/zeit"   # hier liegen die EPUBs (per Mail geholt oder hineinkopiert)
pro_tag = 2
davon_andere = 1                  # 1 Schwerpunkt-Text + 1 Entdeckung aus einem anderen Ressort
min_woerter = 1000                # kürzer = kein Longread
max_woerter = 2500                # länger = sprengt das Frühstück
zaehlt_zur_lesezeit = true        # true: Nachrichten werden entsprechend kürzer
ressorts_bevorzugt = ["Dossier", "Politik", "Wirtschaft"]
ressorts_ausschliessen = ["Hamburg", "Osten", "Schweiz"]

# Optional: Ausgabe automatisch aus dem Postfach holen (nur lesend).
